name: EX19 CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test Flask application
        run: |
          python -m py_compile app.py
          python -c "from app import app; c=app.test_client(); r=c.get('/health'); assert r.status_code == 200; print('Flask health test passed')"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/ex19-app:latest

      - name: Deployment verification
        run: |
          echo "Docker image successfully built and pushed."
          echo "Continuous deployment pipeline completed successfully."
